# Topología mínima del PoC E01 (una sola máquina, sin Kubernetes ni broker):
#   k6 → ingest-router (sharding hash(símbolo) % N + cola acotada) → N shards LMAX
#
# N=2 por defecto. Para N=4: docker compose --profile n4 up --build
# y agregar matching-shard-2/3 a SHARDS del router (ver README).
#
# Nota cpuset: el aislamiento de núcleos (cpuset) solo aplica en hosts Linux.
# En macOS Docker corre dentro de una VM: para la corrida oficial, ejecutar en
# Linux o declarar la limitación en el informe (ver E01 en Helix).
name: arqsoft-reto-1

services:
  matching-shard-0:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: matching-engine }
    environment:
      SHARD_ID: "0"
      PORT: "9090"
      RING_SIZE: "16384"
      # Costo medio por orden (µs) del modelo sintético de lógica de negocio
      # (ver BusinessLogicModel). 0 = apagado: se mide solo el patrón, que es la
      # medición original. El barrido lo fija `make sweep-service`.
      BIZ_MICROS: "${BIZ_MICROS:-0}"
      # Forma de la distribucion del costo: mezcla (default) o lognormal.
      # Las dos comparten media y Cs2, asi que un A/B entre ellas aisla la FORMA.
      BIZ_DIST: "${BIZ_DIST:-mezcla}"
      # Journaling: off | paralelo | serie. Prueba la clausula de H1 sobre
      # mantenerlo fuera del camino critico (ver JournalHandler).
      JOURNAL: "${JOURNAL:-off}"
      JOURNAL_DIR: "/var/lib/engine/journal"
    volumes:
      - journal-0:/var/lib/engine/journal
    # Limites de recursos. Claves de nivel superior a proposito: deploy.resources
    # se IGNORA en silencio fuera de Swarm, asi que usarla daria una restriccion
    # que no existe. 0 = sin limite. Verificar siempre con `docker inspect`.
    cpus: ${SHARD_CPUS:-0}
    cpuset: "${SHARD_CPUSET:-}"
    mem_limit: ${SHARD_MEM:-0}

  matching-shard-1:
