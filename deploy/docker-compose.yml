      # Java Flight Recorder. Vacio = apagado. Se ANEXA a JAVA_OPTS (ver Dockerfile),
      # asi que no pisa ZGC. Lo enciende `make profile-jfr`.
      JFR_OPTS: "${JFR_OPTS:-}"
    volumes:
      - journal-1:/var/lib/engine/journal
      - jfr-1:/var/lib/engine/jfr
    # Limites de recursos. Claves de nivel superior a proposito: deploy.resources
