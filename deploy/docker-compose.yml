    # que no existe. 0 = sin limite. Verificar siempre con `docker inspect`.
    cpus: ${SHARD_CPUS:-0}
    cpuset: "${SHARD_CPUSET:-}"
    mem_limit: ${SHARD_MEM:-0}

  ingest-router:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: ingest-router }
    environment:
      PORT: "8080"
      # N=2 por defecto; `make up-n4` la sobreescribe con los 4 shards.
      SHARDS: "${SHARDS:-matching-shard-0:9090,matching-shard-1:9090}"
      QUEUE_CAPACITY: "10000"
    ports:
      - "8080:8080"
    depends_on:
      - matching-shard-0
      - matching-shard-1
    # cpuset: "6,7"

  # --------------------------------------------------------------------------
  # Observabilidad. Existe por una razon concreta: el veredicto de una corrida
  # se decidia leyendo el resumen de texto de k6 y haciendo grep sobre los logs
  # de los shards. Eso responde "¿paso o no paso?" pero no responde "¿que hizo
  # el sistema durante los 40 minutos?" -- ni permite ver el momento en que se
  # degrada, ni contrastar los dos relojes en la misma linea de tiempo.
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # k6 corre en el anfitrion y escribe aqui: sin este receptor, la mitad
      # externa de la medicion no entra a la misma base de tiempo.
      - --web.enable-remote-write-receiver
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Lectura sin credenciales: la evidencia de un experimento se comparte,
      # y pedir usuario para verla la vuelve inservible como evidencia.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/e01.json
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  journal-0:
  journal-1:
  journal-2:
  journal-3:
  jfr-0:
  jfr-1:
  jfr-2:
  jfr-3:
