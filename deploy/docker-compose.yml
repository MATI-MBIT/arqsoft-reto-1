  ingest-router:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: ingest-router }
    environment:
      PORT: "8080"
      # N=2 por defecto; `make up-n4` la sobreescribe con los 4 shards.
      SHARDS: "${SHARDS:-matching-shard-0:9090,matching-shard-1:9090}"
      QUEUE_CAPACITY: "10000"
    ports:
      - "8080:8080"
    depends_on:
      - matching-shard-0
      - matching-shard-1
    # cpuset: "6,7"

volumes:
  journal-0:
  journal-1:
  journal-2:
  journal-3:
