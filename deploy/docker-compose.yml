    # que no existe. 0 = sin limite. Verificar siempre con `docker inspect`.
    cpus: ${SHARD_CPUS:-0}
    cpuset: "${SHARD_CPUSET:-}"
    mem_limit: ${SHARD_MEM:-0}

  matching-shard-2:
    profiles: ["n4"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: matching-engine }
    environment:
      SHARD_ID: "2"
      PORT: "9090"
      RING_SIZE: "16384"
      # Costo medio por orden (µs) del modelo sintético de lógica de negocio
      # (ver BusinessLogicModel). 0 = apagado: se mide solo el patrón, que es la
      # medición original. El barrido lo fija `make sweep-service`.
      BIZ_MICROS: "${BIZ_MICROS:-0}"
      # Forma de la distribucion del costo: mezcla (default) o lognormal.
      # Las dos comparten media y Cs2, asi que un A/B entre ellas aisla la FORMA.
      BIZ_DIST: "${BIZ_DIST:-mezcla}"
      # Journaling: off | paralelo | serie. Prueba la clausula de H1 sobre
      # mantenerlo fuera del camino critico (ver JournalHandler).
      JOURNAL: "${JOURNAL:-off}"
      JOURNAL_DIR: "/var/lib/engine/journal"
      # Java Flight Recorder. Vacio = apagado. Se ANEXA a JAVA_OPTS (ver Dockerfile),
      # asi que no pisa ZGC. Lo enciende `make profile-jfr`.
      JFR_OPTS: "${JFR_OPTS:-}"
    volumes:
      - journal-2:/var/lib/engine/journal
